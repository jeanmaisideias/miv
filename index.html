<!doctype html><meta charset="utf-8"><title>MIV</title><style>html,body{margin:0;background:#080b10;color:#fff;font-family:Arial,sans-serif}.load{min-height:100vh;display:grid;place-items:center}.load span{opacity:.75}</style><div class="load"><span>Carregando apresentação MIV…</span></div><script>(async()=>{const n=17;let s='';for(let i=0;i<n;i++){s+=await (await fetch(`chunks/${String(i).padStart(3,'0')}.txt`)).text()}const bin=Uint8Array.from(atob(s),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()})().catch(e=>{document.body.innerHTML='<div class="load"><span>Não foi possível carregar a apresentação.</span></div>';console.error(e)});</script>
