<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MIV</title>
<style>
html,body{margin:0;min-height:100%;background:#070a0f;color:#fff;font-family:Arial,sans-serif}
#loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}
#loading span{font-size:12px;letter-spacing:.18em;text-transform:uppercase;opacity:.72}
</style>
</head>
<body>
<div id="loading"><span>Carregando apresentação MIV…</span></div>
<script>
(async()=>{
  const files=["./site-parts-vfinal/part-01.txt","./site-parts-vfinal/part-02.txt","./site-parts-vfinal/part-03.txt","./site-parts-vfinal/part-21.txt","./site-parts-vfinal/part-22.txt","./site-parts-vfinal/part-04.txt","./site-parts-vfinal/part-05.txt","./site-parts-vfinal/part-06.txt","./site-parts-vfinal/part-07.txt","./site-parts-vfinal/part-08.txt","./site-parts-vfinal/part-09.txt","./site-parts-vfinal/part-10.txt","./site-parts-vfinal/part-11.txt","./site-parts-vfinal/part-12.txt","./site-parts-vfinal/part-13.txt","./site-parts-vfinal/part-14.txt","./site-parts-vfinal/part-15.txt","./site-parts-vfinal/part-16.txt","./site-parts-vfinal/part-17.txt","./site-parts-vfinal/part-18.txt","./site-parts-vfinal/part-19.txt","./site-parts-vfinal/part-20.txt"];
  try{
    const parts=await Promise.all(files.map(async u=>{
      const r=await fetch(u,{cache:'no-store'});
      if(!r.ok) throw new Error(u+' '+r.status);
      return r.text();
    }));
    const html=parts.join('');
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.getElementById('loading').innerHTML='<span>Não foi possível carregar a apresentação.</span>';
    console.error(err);
  }
})();
</script>
</body>
</html>
